name: CI

# release.yml only runs on a `v*` tag, so before this workflow existed nothing
# checked a pull request. The E2E suite in particular had never run on CI at all
# — it drives the real Electron app, which needs a display, so it is easy to
# leave out and expensive to leave broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron 44 no longer fetches its binary from a postinstall hook. The
      # unit suite is node-environment and does not need it, but `npm ci` alone
      # leaves node_modules/electron without a binary, so anything that resolves
      # the real Electron would fail here rather than in the job that needs it.
      - run: npm run install-electron
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: E2E (${{ matrix.os }})
    needs: verify
    # Windows is not redundant with Linux here. `getMediaAccessStatus('screen')`
    # returns 'granted' unconditionally on Windows, and the permission recovery
    # card's reachability was rewritten around that measurement — but the
    # assertion that pins it (e2e/permission-recovery.spec.ts, the `win32`
    # branch) is unreachable on a Linux runner, where the else branch only
    # checks membership in a five-value list and passes for any reading. Until
    # this job existed, the measurement the fix rests on was a local check.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install-electron

      - name: Install Playwright browsers and OS dependencies
        # `--with-deps` installs Chromium's shared libraries. Electron ships its
        # own Chromium but links against the same GTK stack, so on Linux this is
        # what makes the binary loadable at all — a missing libgtk-3.so.0 exits
        # 127 and reads as "Process failed to launch!", which looks like a
        # product bug rather than a missing package.
        run: npx playwright install --with-deps chromium

      # Electron needs a display. The Linux runner is headless, so without xvfb
      # the app never opens a window and every spec fails on a timeout. Windows
      # runners have a desktop session, so the wrapper is neither needed nor
      # available there.
      - name: Run E2E suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Run E2E suite (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          # Per-OS name, or the second uploader collides with the first and the
          # failure you most want is the one you cannot download.
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
