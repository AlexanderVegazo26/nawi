<!doctype html>
<!-- The overlay always sits on a black-dimmed screenshot, so its chrome is
     pinned to the dark ramp regardless of the app/OS theme (UX-VIS.1). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' capture: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Select a region</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./overlay.tsx"></script>
  </body>
</html>
