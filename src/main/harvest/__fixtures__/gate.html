<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nawi redaction gate fixture</title>
  </head>
  <body>
    <h1>Sign in</h1>

    <!--
      The three FR-SEC.2 secret classes, one each. Every field starts EMPTY:
      the gate test types the sentinel values itself, so a green run proves the
      value travelled through the real input path rather than sitting in markup
      that a filter could have caught by luck.
    -->
    <form id="login">
      <label for="pw">Password</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" />

      <label for="otp">One-time code</label>
      <input type="text" id="otp" name="otp" autocomplete="one-time-code" />

      <label for="configured-secret">Recovery phrase</label>
      <!-- Matched only by a workspace-configured selector, not by any built-in rule. -->
      <input type="text" id="configured-secret" name="recovery" />

      <label for="username">Username</label>
      <input type="text" id="username" name="username" />

      <button data-testid="submit" id="submit-btn" class="btn btn-primary">Sign in</button>
    </form>

    <script>
      console.error('gate fixture console marker')
    </script>
  </body>
</html>
